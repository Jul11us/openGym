<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title description">
  <title id="title">openGym — Plan. Train. Progress.</title>
  <desc id="description">A typographic openGym cover in charcoal, warm white and pale green. Your routine. Your progress. Self-hosting and ChatGPT Sites.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#171b19"/>
      <stop offset="1" stop-color="#101311"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="800" fill="#101311"/>
  <rect x="24" y="24" width="1552" height="752" rx="4" fill="url(#paper)" stroke="#343b35"/>
  <g fill="none" stroke="#343b35">
    <path d="M80 140H1520M80 650H1520"/>
    <path d="M1124 196V584"/>
    <path d="M1180 324H1492M1180 458H1492"/>
  </g>
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="80" y="103" fill="#f0eee5" font-size="34" font-weight="650" letter-spacing="-1.6">openGym<tspan fill="#c3d8a9">.</tspan></text>
    <text x="1520" y="98" text-anchor="end" fill="#a4aaa0" font-size="14" letter-spacing="2.6">TRAINING, AT YOUR PACE</text>

    <text x="80" y="230" fill="#a4aaa0" font-size="14" letter-spacing="3.2">A PERSONAL TRAINING SPACE</text>
    <text x="74" y="361" fill="#f0eee5" font-size="104" font-weight="550" letter-spacing="-5.7">Your routine.</text>
    <text x="74" y="473" fill="#c3d8a9" font-size="104" font-weight="550" letter-spacing="-5.7">Your progress.</text>
    <text x="82" y="552" fill="#b6bcb1" font-size="23" letter-spacing="-.2">Plan the week. Record each set. See the work add up.</text>

    <g fill="#a4aaa0" font-size="13" letter-spacing="2.4">
      <text x="1180" y="222">01 / PLAN</text>
      <text x="1180" y="356">02 / TRAIN</text>
      <text x="1180" y="490">03 / REVIEW</text>
    </g>
    <g fill="#f0eee5" font-size="27" font-weight="450" letter-spacing="-.7">
      <text x="1180" y="275">A rhythm that fits.</text>
      <text x="1180" y="409">One set at a time.</text>
      <text x="1180" y="543">A longer view.</text>
    </g>

    <rect x="80" y="697" width="38" height="3" fill="#c3d8a9"/>
    <text x="136" y="706" fill="#d3d8cc" font-size="15" letter-spacing="1.5">SELF-HOSTING / CHATGPT SITES</text>
    <text x="1520" y="706" text-anchor="end" fill="#858e81" font-size="15" letter-spacing=".3">Plans. Sessions. Progress.</text>
  </g>
